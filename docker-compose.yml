services:
  ollama:
    image: ollama/ollama:latest
    container_name: retail-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-init:
    image: ollama/ollama:latest
    container_name: retail-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$OLLAMA_MODEL"]
    restart: "no"

  web:
    build: .
    container_name: retail-copywriter
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-replace-this-secret}
    depends_on:
      model-init:
        condition: service_completed_successfully

volumes:
  ollama_data:
